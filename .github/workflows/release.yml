name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Guard - tag matches plugin versions
        run: |
          CORE="${GITHUB_REF_NAME#v}"; CORE="${CORE%%-*}"
          fail=0
          for m in plugins/*/plugin.yaml; do
            v="$(awk '/^version:/{print $2; exit}' "$m")"
            [ "$v" = "$CORE" ] || { echo "::error::$m is $v, expected $CORE"; fail=1; }
          done
          [ "$fail" = 0 ]

      - name: Build registry and plugin artifacts
        env:
          REPO: ${{ github.repository }}
          ASSET_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: bash scripts/build-registry.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*.tar.gz

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/index.yaml
            dist/*.tar.gz
            dist/*.plugin.yaml
